[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "football-fatigue"
version = "0.1.0"
description = "Repository foundation for Football Fatigue & Performance Prediction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "numpy>=1.24,<3"]
vision = [
    "ultralytics>=8.4.30,<9",
    "supervision>=0.25,<0.31",
    "opencv-python>=4.8,<6",
    "scikit-learn>=1.5,<2",
]
tactical = ["accessible-space>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
